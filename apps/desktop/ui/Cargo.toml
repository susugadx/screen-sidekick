[package]
name = "screen-sidekick-desktop-ui"
version = "0.0.0"
edition = "2021"
rust-version = "1.96"
publish = false

[dependencies]
leptos = { version = "0.8.12", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.102"
wasm-bindgen-futures = "0.4.52"
web-sys = { version = "0.3.99", features = ["Clipboard", "Navigator", "Window"] }
