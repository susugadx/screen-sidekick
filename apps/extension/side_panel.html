<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screen Sidekick</title>
    <link rel="stylesheet" href="side_panel.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Screen Sidekick</h1>
        <span id="status" class="status">Idle</span>
      </header>

      <form id="bridge-form" class="settings">
        <label for="bridge-url">Bridge URL</label>
        <input id="bridge-url" name="bridge-url" type="url" autocomplete="off" />

        <label for="bridge-token">Bearer Token</label>
        <input id="bridge-token" name="bridge-token" type="password" autocomplete="off" />

        <button id="save-bridge" type="submit">Save</button>
      </form>

      <section class="actions">
        <button id="capture" type="button">Capture</button>
      </section>

      <section class="preview">
        <div class="preview-heading">
          <h2>ScreenContext JSON</h2>
          <button id="copy-json" type="button" disabled>Copy</button>
        </div>
        <textarea id="screen-context-json" readonly spellcheck="false"></textarea>
      </section>

      <section class="preview">
        <div class="preview-heading">
          <h2>Prompt</h2>
          <button id="copy-prompt" type="button" disabled>Copy</button>
        </div>
        <textarea id="prompt-text" readonly spellcheck="false"></textarea>
      </section>

      <section class="preview">
        <h2>Safety</h2>
        <pre id="safety-summary"></pre>
      </section>
    </main>
    <script type="module" src="dist/side_panel.js"></script>
  </body>
</html>
